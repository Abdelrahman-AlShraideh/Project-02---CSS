<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
    	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    	<title>Colors & Opacity</title>
    	<link rel="stylesheet" href="style.css">
</head>
<body>

    	<h1>CSS Colors & Opacity</h1>

    	<div class="color-box named">
        	Named Color
    	</div>

    	<div class="color-box hex">
        	HEX Color
    	</div>

    	<div class="color-box rgb">
        	RGB Color
    	</div>

    	<div class="color-box rgba">
        	RGBA Color
    	</div>

    	<h2>Opacity vs RGBA</h2>

    	<div class="opacity-box">
        	<p>Opacity: 0.5</p>
    	</div>

    	<div class="rgba-box">
        	<p>RGBA Background: 0.5</p>
    	</div>

</body>
</html>
